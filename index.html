<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIGITALSMOD — Personal Profile</title>
  <meta name="description" content="Trang cá nhân chính thức của DIGITALSMOD. Developer, Creator & Digital Architect.">
  <meta name="theme-color" content="#030712">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-bg: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(255, 255, 255, 0.25);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --radius-lg: 24px;
      --radius-md: 16px;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(139, 92, 246, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* Hiệu ứng hạt Noise nhẹ */
    .noise-bg {
      position: fixed;
      inset: 0;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.025"/></svg>');
      pointer-events: none;
      z-index: 1;
    }

    /* Khung Profile Glass chính */
    .profile-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 36px 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    /* Avatar & Badge */
    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);
    }

    .verified-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: #030712;
      border-radius: 50%;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .profile-tag {
      font-size: 0.85rem;
      color: var(--accent-cyan);
      font-weight: 600;
      background: rgba(6, 182, 212, 0.1);
      padding: 4px 12px;
      border-radius: 100px;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .profile-bio {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 360px;
    }

    /* Icon Mạng Xã Hội */
    .social-links {
      display: flex;
      gap: 14px;
    }

    .social-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      transition: var(--transition);
    }

    .social-icon:hover {
      background: var(--card-hover-bg);
      border-color: var(--accent-cyan);
      transform: translateY(-3px);
      color: var(--accent-cyan);
    }

    /* Trình phát nhạc Widget */
    .music-widget {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .music-play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-cyan);
      color: #000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .music-play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
    }

    .music-info {
      text-align: left;
      flex: 1;
      overflow: hidden;
    }

    .music-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .music-artist {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Danh sách Link Cards */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .link-card {
      width: 100%;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
    }

    .link-card:hover {
      background: var(--card-hover-bg);
      border-color: var(--card-hover-border);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .link-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .link-icon {
      color: var(--accent-cyan);
    }

    /* Footer nhỏ */
    .profile-footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .view-count {
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <div class="noise-bg"></div>

  <div class="profile-card">
    
    <!-- Avatar -->
    <div class="avatar-wrapper">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="DIGITALSMOD" class="avatar">
      <div class="verified-badge">
        <i data-lucide="check-circle-2" style="width: 20px; height: 20px; fill: rgba(6, 182, 212, 0.2);"></i>
      </div>
    </div>

    <!-- Thông tin cá nhân -->
    <div>
      <h1 class="profile-name">DIGITALSMOD</h1>
      <span class="profile-tag">Digital Architect & Dev</span>
    </div>

    <p class="profile-bio">
      Sáng tạo nội dung, lập trình ứng dụng & phát triển trải nghiệm số Liquid Glass hiện đại.
    </p>

    <!-- Mạng xã hội -->
    <div class="social-links">
      <a href="https://github.com" target="_blank" class="social-icon" aria-label="GitHub"><i data-lucide="github" style="width: 18px;"></i></a>
      <a href="https://facebook.com" target="_blank" class="social-icon" aria-label="Facebook"><i data-lucide="facebook" style="width: 18px;"></i></a>
      <a href="https://youtube.com" target="_blank" class="social-icon" aria-label="YouTube"><i data-lucide="youtube" style="width: 18px;"></i></a>
      <a href="https://telegram.org" target="_blank" class="social-icon" aria-label="Telegram"><i data-lucide="send" style="width: 18px;"></i></a>
    </div>

    <!-- Trình phát nhạc đại diện -->
    <div class="music-widget">
      <button class="music-play-btn" id="play-btn" aria-label="Play Music">
        <i data-lucide="play" id="play-icon" style="width: 16px;"></i>
      </button>
      <div class="music-info">
        <div class="music-title">Cyber Midnight Ambient</div>
        <div class="music-artist">DIGITALSMOD Audio</div>
      </div>
      <i data-lucide="music" style="width: 18px; color: var(--text-muted);"></i>
    </div>

    <!-- Danh sách Liên kết cá nhân -->
    <div class="links-list">
      <a href="https://quocdat.online" target="_blank" class="link-card">
        <div class="link-content">
          <i data-lucide="globe" class="link-icon" style="width: 18px;"></i>
          <span>Website chính thức</span>
        </div>
        <i data-lucide="arrow-up-right" style="width: 16px; color: var(--text-muted);"></i>
      </a>

      <a href="#projects" class="link-card">
        <div class="link-content">
          <i data-lucide="code-2" class="link-icon" style="width: 18px;"></i>
          <span>Dự án Open Source</span>
        </div>
        <i data-lucide="arrow-up-right" style="width: 16px; color: var(--text-muted);"></i>
      </a>

      <a href="#store" class="link-card">
        <div class="link-content">
          <i data-lucide="shopping-bag" class="link-icon" style="width: 18px;"></i>
          <span>Digital Store & Tools</span>
        </div>
        <i data-lucide="arrow-up-right" style="width: 16px; color: var(--text-muted);"></i>
      </a>

      <a href="#contact" class="link-card">
        <div class="link-content">
          <i data-lucide="mail" class="link-icon" style="width: 18px;"></i>
          <span>Liên hệ công việc</span>
        </div>
        <i data-lucide="arrow-up-right" style="width: 16px; color: var(--text-muted);"></i>
      </a>
    </div>

    <!-- Footer -->
    <div class="profile-footer">
      <div class="view-count">
        <i data-lucide="eye" style="width: 14px;"></i> 12,850 lượt xem
      </div>
      <span>•</span>
      <span>© 2026 DIGITALSMOD</span>
    </div>

  </div>

  <script>
    // Khởi tạo icons
    lucide.createIcons();

    // Xử lý nút Play nhạc
    const playBtn = document.getElementById('play-btn');
    let isPlaying = false;

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.innerHTML = isPlaying 
        ? '<i data-lucide="pause" style="width: 16px;"></i>' 
        : '<i data-lucide="play" style="width: 16px;"></i>';
      lucide.createIcons();
    });
  </script>
</body>
</html>
