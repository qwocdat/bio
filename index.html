<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIGITALSMOD BIO — quocdat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  box-sizing:border-box;
  --bg:#0a0b10; --bg2:#111319;
  --glass-bg:rgba(255,255,255,0.07); --glass-border:rgba(255,255,255,0.14);
  --glass-blur:22px; --glass-sat:150%; --glass-shadow:0 8px 32px rgba(0,0,0,0.45);
  --tint:255,255,255;
  --text:#f2f3f6; --text-2:#9aa1b0;
  --accent:#3e63e0; --accent-2:#8a5cf6;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}

html,body{height:100%}
body{
  margin:0; font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:var(--text);
  background:radial-gradient(circle at 20% 0%, var(--bg2), var(--bg) 60%);
  overflow-x:hidden; min-height:100%; position:relative;
}

#fxCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

.glass{
  background:rgba(var(--tint), 0.08);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
}

#gate{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 30%, var(--bg2), var(--bg) 70%);
  transition:opacity .6s ease, visibility .6s; cursor:pointer;
}
#gate.hide{opacity:0; visibility:hidden; pointer-events:none}
.gate-text{
  font-family: 'Press Start 2P', cursive; font-size: 1.1rem; color: var(--text);
  text-transform: uppercase; letter-spacing: 2px; animation: pulse 1.8s infinite; text-align: center; padding: 20px;
}
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.98); } }

#app{
  opacity:0; transform:translateY(14px) scale(.985); transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);
  max-width:420px; margin:0 auto; padding:26px 16px 40px; min-height:100%; z-index: 20; position: relative;
}
#app.show{opacity:1; transform:none}

.card{border-radius:28px; padding:24px 20px; text-align:center;}

.avatar-container { position: relative; width: 88px; height: 88px; margin: 0 auto 14px; }
.avatar-wrap{ width:100%; height:100%; border-radius:50%; padding:3px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); }
.avatar{width:100%; height:100%; border-radius:50%; background:#202430 center/cover; border:3px solid rgba(var(--tint),.9)}

.name-row{display:flex; align-items:center; justify-content:center; gap:6px}
.name-row h2{margin:0; font-size:1.15rem; font-weight:800}
.badge{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center}
.badge svg{width:9px;height:9px}
.uname{color:var(--text-2); font-size:.85rem; margin:2px 0 10px}
.bio{font-size:.85rem; color:var(--text-2); line-height:1.5; margin:0 0 16px}

.sec-title { text-align: left; font-size: .75rem; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 10px; }

.btn-fx { position: relative; overflow: hidden; transition: transform .2s ease; }
.btn-fx:active { transform: scale(0.96); }
.ripple {
  position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.35);
  transform: scale(0); animation: ripple-anim 0.6s linear; pointer-events: none;
}
@keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

.link-btn{
  display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:16px; margin-bottom:10px; cursor:pointer; text-decoration: none; color: inherit;
}
.link-ico{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none; display:flex; align-items:center; justify-content:center;}
.link-ico svg{width:18px;height:18px;fill:#fff;}
.link-btn span{font-size:.85rem; font-weight:600; text-align: left; flex:1;}
.link-btn small{display:block; color:var(--text-2); font-weight:400; font-size:.72rem}
</style>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<div id="gate"><div class="gate-text">CLICK TO ENTER</div></div>

<div id="app">
  <div class="card glass">
    <div class="avatar-container">
      <div class="avatar-wrap"><div class="avatar" id="avatarImg"></div></div>
    </div>

    <div class="name-row">
      <h2>Quốc Đạt</h2>
      <span class="badge"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></span>
    </div>
    <div class="uname">@quocdat · digitalsmod</div>
    <p class="bio">Designer & developer building calm, glassy interfaces. Sài Gòn 🇻🇳</p>

    <div class="sec-title">Danh mục liên kết</div>
    <div id="links-container">Đang tải dữ liệu...</div>
  </div>
</div>

<script>
// SUPABASE CONFIG
const SUPABASE_URL = 'https://pooenvxslutetbllasvi.supabase.co';
const SUPABASE_ANON_KEY = 'THAY_ANON_KEY_CỦA_BẠN'; // <--- Dán key anon vào đây
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Gate Enter
document.getElementById('gate').addEventListener('click', ()=>{
  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').classList.add('show');
});

// Load nút từ Supabase
async function fetchLinks() {
  const { data, error } = await db.from('links').select('*').order('sort_order', { ascending: true });
  const container = document.getElementById('links-container');
  
  if (error || !data || data.length === 0) {
    container.innerHTML = '<p style="font-size:0.8rem; color:var(--text-2);">Chưa có liên kết nào</p>';
    return;
  }

  container.innerHTML = '';
  data.forEach(item => {
    container.innerHTML += `
      <a href="${item.url}" target="_blank" class="link-btn glass btn-fx">
        <div class="link-ico">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        </div>
        <div>
          <span>${item.title}</span>
          <small>${item.subtitle || ''}</small>
        </div>
      </a>
    `;
  });
  
  // Re-bind ripple effect
  bindRipples();
}

function bindRipples() {
  document.querySelectorAll('.btn-fx').forEach(btn => {
    btn.addEventListener('click', function(e) {
      const circle = document.createElement('span');
      const diameter = Math.max(btn.clientWidth, btn.clientHeight);
      const radius = diameter / 2;
      const rect = btn.getBoundingClientRect();
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${e.clientX - rect.left - radius}px`;
      circle.style.top = `${e.clientY - rect.top - radius}px`;
      circle.classList.add('ripple');
      const ripple = btn.getElementsByClassName('ripple')[0];
      if (ripple) { ripple.remove(); }
      btn.appendChild(circle);
    });
  });
}

fetchLinks();

// Canvas Tuyết Rơi
const canvas = document.getElementById('fxCanvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

const snowFlakes = [];
for (let i = 0; i < 65; i++) {
  snowFlakes.push({
    x: Math.random() * width, y: Math.random() * height,
    r: Math.random() * 2.5 + 1, d: Math.random() + 0.5,
    vx: 0, vy: 0
  });
}

const burstParticles = [];
function createBurst(x, y) {
  for (let i = 0; i < 16; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1.5;
    burstParticles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, size: Math.random() * 3 + 1.5 });
  }
}

window.addEventListener('click', e => createBurst(e.clientX, e.clientY));
window.addEventListener('touchstart', e => { if (e.touches.length > 0) createBurst(e.touches[0].clientX, e.touches[0].clientY); });

function draw() {
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.beginPath();
  snowFlakes.forEach(p => {
    ctx.moveTo(p.x, p.y);
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    p.y += p.d;
    if (p.y > height) { p.y = -10; p.x = Math.random() * width; }
  });
  ctx.fill();

  for (let i = burstParticles.length - 1; i >= 0; i--) {
    const p = burstParticles[i];
    ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    p.x += p.vx; p.y += p.vy; p.life -= 0.03;
    if (p.life <= 0) burstParticles.splice(i, 1);
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
