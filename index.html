<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIGITALSMOD BIO</title>
<meta name="description" content="DIGITALSMOD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    height: 100%; margin: 0; padding: 0;
    background: radial-gradient(circle at 50% 30%, #111319, #0a0b10 70%);
    overflow: hidden; font-family: 'Press Start 2P', cursive;
  }
  #fxCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
  #gate {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .gate-text {
    font-size: 1.1rem; color: #f2f3f6;
    text-transform: uppercase; letter-spacing: 2px;
    animation: pulse 1.8s infinite; text-align: center; padding: 20px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.98); }
  }
  noscript { color:#f2f3f6; font-family: system-ui, sans-serif; position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; z-index:20; background:#0a0b10; }
</style>
</head>
<body>

<noscript><div>Vui lòng bật JavaScript để tiếp tục, hoặc <a href="digitalxiao.html" style="color:#8a5cf6">bấm vào đây</a>.</div></noscript>

<canvas id="fxCanvas"></canvas>

<div id="gate" onclick="goNext()">
  <div class="gate-text">CLICK TO ENTER</div>
</div>

<script>
let navigated = false;
function goNext() {
  if (navigated) return;
  navigated = true;
  window.location.href = "digitalxiao.html";
}

const canvas = document.getElementById('fxCanvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
let running = true;

window.onresize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };

const snowFlakes = [];
for (let i = 0; i < 50; i++) {
  snowFlakes.push({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 2 + 1, d: Math.random() + 0.5 });
}

function draw() {
  if (!running) return;
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.beginPath();
  snowFlakes.forEach(p => {
    ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    p.y += p.d;
    if (p.y > height) { p.y = -10; p.x = Math.random() * width; }
  });
  ctx.fill();
  requestAnimationFrame(draw);
}
draw();

document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) draw(); });
</script>
</body>
</html>
