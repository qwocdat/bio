<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Màn hình hiển thị</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  #frame {
    width: 100%;
    height: 100vh;
    border: none;
    display: block;
  }
  #waiting {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111827;
    color: #9ca3af;
    font-style: italic;
  }
  .status-dot {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 8px 2px rgba(239,68,68,0.6);
    z-index: 999;
  }
  .status-dot.live {
    background: #22c55e;
    box-shadow: 0 0 8px 2px rgba(34,197,94,0.6);
  }
</style>
</head>
<body>
  <div class="status-dot" id="statusDot"></div>
  <div id="waiting">Đang chờ mã HTML từ Dashboard...</div>
  <iframe id="frame" style="display:none;"></iframe>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAUuV5euNNLHE2Cf6tXzUHV-ChKwNF593Y",
    authDomain: "quocdat-396fe.firebaseapp.com",
    databaseURL: "https://quocdat-396fe-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "quocdat-396fe",
    storageBucket: "quocdat-396fe.firebasestorage.app",
    messagingSenderId: "685476439350",
    appId: "1:685476439350:web:ba9cd78dca8351c5383f97"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const liveRef = ref(db, 'liveHtml');

  const frame = document.getElementById('frame');
  const waiting = document.getElementById('waiting');
  const statusDot = document.getElementById('statusDot');

  onValue(liveRef, (snapshot) => {
    const html = snapshot.val();
    if (!html) return;
    waiting.style.display = 'none';
    frame.style.display = 'block';
    frame.srcdoc = html;
    statusDot.classList.add('live');
  }, (err) => {
    waiting.textContent = 'Lỗi kết nối Firebase: ' + err.message;
  });
</script>
</body>
</html>
