<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIGITALSMOD BIO — quocdat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  box-sizing:border-box;
  --bg:#0a0b10; --bg2:#111319;
  --glass-bg:rgba(255,255,255,0.07); --glass-border:rgba(255,255,255,0.14);
  --glass-blur:22px; --glass-sat:150%; --glass-shadow:0 8px 32px rgba(0,0,0,0.45);
  --tint:255,255,255;
  --text:#f2f3f6; --text-2:#9aa1b0;
  --accent:#3e63e0; --accent-2:#8a5cf6;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ height:100%; margin:0; font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:var(--text); background:radial-gradient(circle at 20% 0%, var(--bg2), var(--bg) 60%); overflow-x:hidden; position:relative; }

#fxCanvas { position: fixed; inset: 0; pointer-events: none !important; z-index: 1; }

.glass{
  background:rgba(var(--tint), 0.08);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
}

#app{
  max-width:420px; margin:0 auto; padding:26px 16px 40px; min-height:100%; z-index: 10; position: relative;
}

.card{border-radius:28px; padding:24px 20px; text-align:center;}
.avatar-container { position: relative; width: 88px; height: 88px; margin: 0 auto 14px; }
.avatar-wrap{ width:100%; height:100%; border-radius:50%; padding:3px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); }
.avatar{width:100%; height:100%; border-radius:50%; background:#202430 center/cover; border:3px solid rgba(var(--tint),.9)}

.name-row{display:flex; align-items:center; justify-content:center; gap:6px}
.name-row h2{margin:0; font-size:1.15rem; font-weight:800}
.badge{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center}
.badge svg{width:9px;height:9px}
.uname{color:var(--text-2); font-size:.85rem; margin:2px 0 10px}
.bio{font-size:.85rem; color:var(--text-2); line-height:1.5; margin:0 0 16px}

.sec-title { text-align: left; font-size: .75rem; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 10px; }

.btn-fx { position: relative; overflow: hidden; transition: transform .2s ease; }
.btn-fx:active { transform: scale(0.96); }

.link-btn{
  display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:16px; margin-bottom:10px; cursor:pointer; text-decoration: none; color: inherit;
}
.link-ico{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none; display:flex; align-items:center; justify-content:center;}
.link-ico svg{width:18px;height:18px;fill:#fff;}
.link-btn span{font-size:.85rem; font-weight:600; text-align: left; flex:1;}
.link-btn small{display:block; color:var(--text-2); font-weight:400; font-size:.72rem}

.soc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.soc{ aspect-ratio:1; border-radius:16px; display:flex; align-items:center; justify-content:center; cursor: pointer; text-decoration: none; }
.soc svg{width:20px; height:20px; fill: var(--text);}
</style>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<div id="app">
  <div class="card glass">
    <div class="avatar-container">
      <div class="avatar-wrap"><div class="avatar" id="avatarImg"></div></div>
    </div>

    <div class="name-row">
      <h2>Quốc Đạt</h2>
      <span class="badge"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></span>
    </div>
    <div class="uname">@quocdat · digitalsmod</div>
    <p class="bio">Designer & developer building calm, glassy interfaces. Sài Gòn 🇻🇳</p>

    <div class="sec-title">Danh mục liên kết</div>
    <div id="links-container">Đang tải dữ liệu...</div>

    <div class="sec-title">Mạng xã hội</div>
    <div class="soc-grid">
      <a href="#" class="soc glass btn-fx"><svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg></a>
      <a href="#" class="soc glass btn-fx"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
      <a href="#" class="soc glass btn-fx"><svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.98-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.82.56-1.36 1.52-1.36 2.53-.02 1.01.44 2.03 1.23 2.67.84.7 2.01.93 3.04.58.98-.32 1.74-1.18 1.96-2.18.1-.55.08-1.12.08-1.68.01-4.98.01-9.97.01-14.96z"/></svg></a>
      <a href="#" class="soc glass btn-fx"><svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></a>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDM5EOHtjhxrWvGxL7hegMi5n0TbdV9cpw",
    authDomain: "taikhoan-fc704.firebaseapp.com",
    databaseURL: "https://taikhoan-fc704-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "taikhoan-fc704",
    storageBucket: "taikhoan-fc704.firebasestorage.app",
    messagingSenderId: "867203109533",
    appId: "1:867203109533:web:ec5b3b8efd2fee8df37a74"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const container = document.getElementById('links-container');
  const linksRef = ref(db, 'links');

  onValue(linksRef, (snapshot) => {
    const data = snapshot.val();
    if (!data) {
      container.innerHTML = '<p style="font-size:0.8rem; color:#9aa1b0;">Chưa có liên kết nào</p>';
      return;
    }

    container.innerHTML = '';
    const linkList = Object.keys(data).map(key => ({ id: key, ...data[key] }));
    linkList.sort((a, b) => (parseInt(a.sort_order) || 0) - (parseInt(b.sort_order) || 0));

    linkList.forEach(item => {
      container.innerHTML += `
        <a href="${item.url}" target="_blank" class="link-btn glass btn-fx">
          <div class="link-ico">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          </div>
          <div>
            <span>${item.title}</span>
            <small>${item.subtitle || ''}</small>
          </div>
        </a>
      `;
    });
  }, (error) => {
    container.innerHTML = '<p style="font-size:0.8rem; color:#e53935;">Lỗi kết nối CSDL Firebase</p>';
  });
</script>

<script>
// Tuyết rơi Canvas
const canvas = document.getElementById('fxCanvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.onresize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; };

const snowFlakes = [];
for (let i = 0; i < 50; i++) {
  snowFlakes.push({ x: Math.random() * width, y: Math.random() * height, r: Math.random() * 2 + 1, d: Math.random() + 0.5 });
}

function draw() {
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.beginPath();
  snowFlakes.forEach(p => {
    ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    p.y += p.d;
    if (p.y > height) { p.y = -10; p.x = Math.random() * width; }
  });
  ctx.fill();
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
