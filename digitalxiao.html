<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIGITALSMOD</title>
<meta name="description" content=" DIGITALSMOD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
:root{
  box-sizing:border-box;
  --bg:#0a0b10; --bg2:#111319;
  --glass-bg:rgba(255,255,255,0.07); --glass-border:rgba(255,255,255,0.14);
  --glass-blur:22px; --glass-sat:150%; --glass-shadow:0 8px 32px rgba(0,0,0,0.45);
  --tint:255,255,255;
  --text:#f2f3f6; --text-2:#9aa1b0;
  --accent:#3e63e0; --accent-2:#8a5cf6;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ height:100%; margin:0; font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:var(--text); background:radial-gradient(circle at 20% 0%, var(--bg2), var(--bg) 60%); overflow-x:hidden; position:relative; }
#fxCanvas { position: fixed; inset: 0; pointer-events: none !important; z-index: 1; }
.glass{
  background:rgba(var(--tint), 0.08);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
}
#app{ max-width:420px; margin:0 auto; padding:26px 16px 40px; min-height:100%; z-index: 10; position: relative; }
.card{border-radius:28px; padding:24px 20px; text-align:center;}
.avatar-container { position: relative; width: 88px; height: 88px; margin: 0 auto 14px; }
.avatar-wrap{ width:100%; height:100%; border-radius:50%; padding:3px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); }
.avatar{width:100%; height:100%; border-radius:50%; background:#202430 center/cover no-repeat; border:3px solid rgba(var(--tint),.9); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.4rem; color:var(--text-2);}
.name-row{display:flex; align-items:center; justify-content:center; gap:6px}
.name-row h2{margin:0; font-size:1.15rem; font-weight:800}
.badge{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center; flex:none;}
.badge svg{width:9px;height:9px}
.uname{color:var(--text-2); font-size:.85rem; margin:2px 0 10px}
.bio{font-size:.85rem; color:var(--text-2); line-height:1.5; margin:0 0 16px}
.sec-title { text-align: left; font-size: .75rem; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 10px; }
.btn-fx { position: relative; overflow: hidden; transition: transform .2s ease; }
.btn-fx:active { transform: scale(0.96); }
.link-btn{ display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:16px; margin-bottom:10px; cursor:pointer; text-decoration: none; color: inherit; }
.link-ico{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none; display:flex; align-items:center; justify-content:center;}
.link-ico svg{width:18px;height:18px;fill:#fff;}
.link-btn .link-meta{flex:1; min-width:0; text-align:left;}
.link-btn span{font-size:.85rem; font-weight:600; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.link-btn small{display:block; color:var(--text-2); font-weight:400; font-size:.72rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.link-clicks{font-size:.68rem; color:var(--text-2); flex:none;}
.soc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.soc{ aspect-ratio:1; border-radius:16px; display:flex; align-items:center; justify-content:center; cursor: pointer; text-decoration: none; font-size:1.1rem;}
.empty-msg,.err-msg{font-size:.8rem; color:var(--text-2); text-align:left;}
.err-msg{color:#ff8a80;}
</style>
</head>
<body>

<canvas id="fxCanvas"></canvas>

<div id="app">
  <div class="card glass">
    <div class="avatar-container">
      <div class="avatar-wrap"><div class="avatar" id="avatarImg">?</div></div>
    </div>

    <div class="name-row">
      <h2 id="p-name">Đang tải...</h2>
      <span class="badge" id="p-badge" style="display:none">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      </span>
    </div>
    <div class="uname" id="p-uname"></div>
    <p class="bio" id="p-bio"></p>

    <div class="sec-title">Danh mục liên kết</div>
    <div id="links-container">Đang tải dữ liệu...</div>

    <div class="sec-title" id="soc-title" style="display:none">Mạng xã hội</div>
    <div class="soc-grid" id="soc-grid"></div>
  </div>
</div>

<script>
// ====== CẤU HÌNH FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyAUuV5euNNLHE2Cf6tXzUHV-ChKwNF593Y",
  authDomain: "quocdat-396fe.firebaseapp.com",
  databaseURL: "https://quocdat-396fe-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "quocdat-396fe",
  storageBucket: "quocdat-396fe.firebasestorage.app",
  messagingSenderId: "685476439350",
  appId: "1:685476439350:web:949054ecba7f0a0c383f97"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ====== PROFILE (đọc /profile) ======
db.ref('profile').on('value', snap => {
  const p = snap.val() || {};
  const name = p.name || 'DIGITALSMOD';
  document.getElementById('p-name').textContent = name;
  document.getElementById('p-uname').textContent = p.username || '';
  document.getElementById('p-bio').textContent = p.bio || '';
  document.getElementById('p-badge').style.display = p.verified ? 'flex' : 'none';

  const avatarEl = document.getElementById('avatarImg');
  if (p.avatar) {
    avatarEl.style.backgroundImage = `url('${p.avatar.replace(/'/g, "%27")}')`;
    avatarEl.textContent = '';
  } else {
    avatarEl.style.backgroundImage = 'none';
    avatarEl.textContent = name.trim().charAt(0).toUpperCase() || '?';
  }
}, () => {
  document.getElementById('p-name').textContent = 'Lỗi tải hồ sơ';
});

// ====== SOCIAL ICONS (đọc /socials) ======
db.ref('socials').on('value', snap => {
  const data = snap.val();
  const grid = document.getElementById('soc-grid');
  const title = document.getElementById('soc-title');
  grid.innerHTML = '';
  if (!data) { title.style.display = 'none'; return; }
  title.style.display = 'block';

  Object.values(data).forEach(s => {
    const a = document.createElement('a');
    a.className = 'soc glass btn-fx';
    a.href = s.url || '#';
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = s.label || '';
    a.textContent = s.icon || (s.label ? s.label.charAt(0).toUpperCase() : '?');
    grid.appendChild(a);
  });
});

// ====== LINKS (đọc /links, escape HTML, đếm click) ======
const linksContainer = document.getElementById('links-container');
db.ref('links').on('value', (snapshot) => {
  const data = snapshot.val();
  linksContainer.innerHTML = '';

  if (!data) {
    linksContainer.innerHTML = '<p class="empty-msg">Chưa có liên kết nào</p>';
    return;
  }

  const linkList = Object.keys(data).map(key => ({ id: key, ...data[key] }));
  linkList.sort((a, b) => (parseInt(a.sort_order) || 0) - (parseInt(b.sort_order) || 0));

  const frag = document.createDocumentFragment();
  linkList.forEach(item => {
    const a = document.createElement('a');
    a.href = item.url || '#';
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'link-btn glass btn-fx';
    a.innerHTML = `
      <div class="link-ico">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      </div>
      <div class="link-meta">
        <span>${escapeHtml(item.title)}</span>
        <small>${escapeHtml(item.subtitle || '')}</small>
      </div>
      <div class="link-clicks">${item.clicks || 0}👁</div>
    `;
    a.addEventListener('click', () => {
      db.ref(`links/${item.id}/clicks`).transaction(c => (c || 0) + 1);
    });
    frag.appendChild(a);
  });
  linksContainer.appendChild(frag);
}, () => {
  linksContainer.innerHTML = '<p class="err-msg">Lỗi: chưa mở Rules Firebase cho phép đọc (read) tại node "links".</p>';
});

// ====== HIỆU ỨNG TUYẾT RƠI ======
const canvas = document.getElementById('fxCanvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });
const snowFlakes = Array.from({length:50}, () => ({ x: Math.random()*width, y: Math.random()*height, r: Math.random()*2+1, d: Math.random()+0.5 }));
function draw() {
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.beginPath();
  snowFlakes.forEach(p => {
    ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    p.y += p.d;
    if (p.y > height) { p.y = -10; p.x = Math.random() * width; }
  });
  ctx.fill();
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
