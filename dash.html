<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Bio Link</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-base: #0a0a0c;
      --accent-color: #8b5cf6;
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-blur: blur(20px);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      align-items: stretch;
      overflow-x: hidden;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
    }

    .admin-wrapper { display: flex; width: 100vw; min-height: 100vh; }
    .sidebar { width: 260px; padding: 24px; border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 20px; }
    .main-editor { flex: 1; padding: 32px; overflow-y: auto; max-height: 100vh; }
    .preview-pane { width: 420px; padding: 24px; border-left: 1px solid var(--glass-border); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .phone-mockup { width: 360px; height: 720px; border-radius: 40px; border: 8px solid #222; overflow-y: auto; position: relative; background: #000; }
    
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    input, textarea, select { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; padding: 12px; border-radius: 8px; font-size: 0.9rem; }
    button.btn-primary { background: var(--accent-color); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    
    .nav-btn { background: transparent; border: none; color: var(--text-muted); padding: 12px; text-align: left; cursor: pointer; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
    .nav-btn.active, .nav-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .card-list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid var(--glass-border); border-radius: 8px; margin-bottom: 8px; background: rgba(255,255,255,0.02); }

    @media (max-width: 1024px) {
      .preview-pane { display: none; }
      .admin-wrapper { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--glass-border); }
    }
  </style>
</head>
<body>

  <div class="admin-wrapper">
    <aside class="sidebar glass-panel">
      <h3>Control Panel</h3>
      <nav style="display:flex; flex-direction:column; gap:8px;">
        <button class="nav-btn active" onclick="switchTab('dashboard')"><i class="fa-solid fa-chart-pie"></i> Thống kê</button>
        <button class="nav-btn" onclick="switchTab('profile')"><i class="fa-solid fa-user-gear"></i> Cá nhân</button>
        <button class="nav-btn" onclick="switchTab('links')"><i class="fa-solid fa-link"></i> Quản lý Link</button>
        <button class="nav-btn" onclick="switchTab('socials')"><i class="fa-solid fa-share-nodes"></i> Mạng xã hội</button>
        <button class="nav-btn" onclick="switchTab('appearance')"><i class="fa-solid fa-wand-magic-sparkles"></i> Giao diện</button>
      </nav>
    </aside>

    <main class="main-editor">
      <section id="tab-dashboard">
        <h2>Tổng quan Thống kê</h2>
        <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:16px; margin-top:20px;">
          <div class="glass-panel" style="padding:20px;">
            <h4>Lượt ghé thăm</h4>
            <h1 id="stat-views" style="color:var(--accent-color);">0</h1>
          </div>
          <div class="glass-panel" style="padding:20px;">
            <h4>Click Liên kết</h4>
            <h1 id="stat-clicks" style="color:var(--accent-color);">0</h1>
          </div>
        </div>
      </section>

      <section id="tab-profile" style="display:none;">
        <h2>Thông tin Cá nhân</h2>
        <div class="form-group" style="margin-top:16px;">
          <label>Username (URL Identification)</label>
          <input type="text" id="edit-username" placeholder="quocdat">
        </div>
        <div class="form-group">
          <label>Tên hiển thị</label>
          <input type="text" id="edit-name">
        </div>
        <div class="form-group">
          <label>Bio (Giới thiệu)</label>
          <textarea id="edit-bio" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Avatar URL</label>
          <input type="text" id="edit-avatar-url" placeholder="https://example.com/avatar.png">
        </div>
        <div class="form-group">
          <label>Huy hiệu Badge</label>
          <select id="edit-badge">
            <option value="none">Không có</option>
            <option value="verified">Verified (Tích xanh)</option>
            <option value="vip">VIP Crown</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label>Hiệu ứng Avatar</label>
          <select id="edit-avatar-anim">
            <option value="">Không có</option>
            <option value="float">Float (Bay nhẹ)</option>
            <option value="pulse">Pulse (Nảy)</option>
            <option value="glow">Glow (Phát sáng)</option>
          </select>
        </div>
        <button id="btn-save-profile" class="btn-primary">Lưu Cá Nhân</button>
      </section>

      <section id="tab-links" style="display:none;">
        <h2>Quản lý Đường Dẫn</h2>
        <div class="glass-panel" style="padding:16px; margin: 16px 0;">
          <h4>Thêm / Sửa Link</h4>
          <input type="hidden" id="link-id-hidden">
          <div class="form-group" style="margin-top:8px;">
            <label>Tiêu đề</label>
            <input type="text" id="link-title" placeholder="Ví dụ: YouTube Channel">
          </div>
          <div class="form-group">
            <label>URL</label>
            <input type="url" id="link-url" placeholder="https://youtube.com/...">
          </div>
          <div class="form-group">
            <label>Mô tả ngắn</label>
            <input type="text" id="link-desc" placeholder="Xem video mới nhất">
          </div>
          <div class="form-group">
            <label>FontAwesome Icon Class</label>
            <input type="text" id="link-icon" placeholder="fa-brands fa-youtube">
          </div>
          <button id="btn-save-link" class="btn-primary">Lưu Link</button>
        </div>
        <div id="admin-links-list"></div>
      </section>

      <section id="tab-socials" style="display:none;">
        <h2>Mạng Xã Hội</h2>
        <div id="socials-editor-list" style="margin-top:16px;"></div>
        <button id="btn-save-socials" class="btn-primary" style="margin-top:16px;">Lưu Mạng Xã Hội</button>
      </section>

      <section id="tab-appearance" style="display:none;">
        <h2>Giao diện & Nhạc nền</h2>
        <div class="form-group" style="margin-top:16px;">
          <label>Màu Accent (Chủ đạo)</label>
          <input type="color" id="edit-accent" style="height:40px;">
        </div>
        <div class="form-group">
          <label>Loại Background</label>
          <select id="edit-bg-type">
            <option value="color">Màu/Gradient CSS</option>
            <option value="image">Hình ảnh URL</option>
            <option value="video">Video MP4 URL</option>
          </select>
        </div>
        <div class="form-group">
          <label>Giá trị Background (Màu, Gradient hoặc URL Media)</label>
          <input type="text" id="edit-bg-value" placeholder="linear-gradient(135deg, #111, #222) hoặc URL">
        </div>
        <div class="form-group">
          <label>Nhạc nền Audio URL (MP3)</label>
          <input type="url" id="edit-music-url" placeholder="https://site.com/audio.mp3">
        </div>
        <div class="form-group" style="flex-direction:row; align-items:center; gap:10px;">
          <input type="checkbox" id="edit-click-enter" style="width:20px; height:20px;">
          <label for="edit-click-enter">Bật màn hình "Click to Enter"</label>
        </div>
        <button id="btn-save-appearance" class="btn-primary">Lưu Giao Diện</button>
      </section>
    </main>

    <aside class="preview-pane">
      <h3>Live Preview</h3>
      <div class="phone-mockup">
        <iframe id="preview-iframe" src="about:blank" style="width:100%; height:100%; border:none;"></iframe>
      </div>
    </aside>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDM5EOHtjhxrWvGxL7hegMi5n0TbdV9cpw",
      authDomain: "taikhoan-fc704.firebaseapp.com",
      databaseURL: "https://taikhoan-fc704-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "taikhoan-fc704",
      storageBucket: "taikhoan-fc704.firebasestorage.app",
      messagingSenderId: "867203109533",
      appId: "1:867203109533:web:ec5b3b8efd2fee8df37a74",
      measurementId: "G-PQDSS2N5XE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Sử dụng Node UID cố định không cần xác thực
    const currentUID = "public_bio";
    let profileData = {};
    let linksData = {};
    let socialsData = {};

    function sanitizeHTML(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    window.switchTab = function(tabName) {
      document.querySelectorAll('main > section').forEach(s => s.style.display = 'none');
      document.getElementById(`tab-${tabName}`).style.display = 'block';
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
    };

    function initAdminData() {
      const dbRef = ref(db);

      onValue(child(dbRef, `profiles/${currentUID}`), (snap) => {
        if (snap.exists()) {
          profileData = snap.val();
          populateProfileForm(profileData);
          updatePreview();
        }
      });

      onValue(child(dbRef, `links/${currentUID}`), (snap) => {
        linksData = snap.exists() ? snap.val() : {};
        renderAdminLinks(linksData);
        updatePreview();
      });

      onValue(child(dbRef, `socials/${currentUID}`), (snap) => {
        socialsData = snap.exists() ? snap.val() : {};
        renderAdminSocials(socialsData);
        updatePreview();
      });

      onValue(child(dbRef, `analytics/${currentUID}`), (snap) => {
        if (snap.exists()) {
          document.getElementById('stat-views').innerText = snap.val().views || 0;
          document.getElementById('stat-clicks').innerText = snap.val().clicks || 0;
        }
      });
    }

    function updatePreview() {
      if (profileData.username) {
        document.getElementById('preview-iframe').src = `index.html?u=${profileData.username}&preview=true`;
      }
    }

    document.getElementById('btn-save-profile').addEventListener('click', async () => {
      const username = document.getElementById('edit-username').value.trim().toLowerCase();
      const name = document.getElementById('edit-name').value;
      const bio = document.getElementById('edit-bio').value;
      const badge = document.getElementById('edit-badge').value;
      const avatarAnim = document.getElementById('edit-avatar-anim').value;
      const avatarUrl = document.getElementById('edit-avatar-url').value.trim();

      if (profileData.username && profileData.username !== username) {
        await remove(ref(db, `usernames/${profileData.username}`));
      }
      if (username) {
        await set(ref(db, `usernames/${username}`), { uid: currentUID });
      }

      const payload = { ...profileData, username, name, bio, badge, avatarAnim, avatar: avatarUrl };
      await set(ref(db, `profiles/${currentUID}`), payload);
      alert('Đã cập nhật Profile!');
    });

    function populateProfileForm(data) {
      document.getElementById('edit-username').value = data.username || '';
      document.getElementById('edit-name').value = data.name || '';
      document.getElementById('edit-bio').value = data.bio || '';
      document.getElementById('edit-avatar-url').value = data.avatar || '';
      document.getElementById('edit-badge').value = data.badge || 'none';
      document.getElementById('edit-avatar-anim').value = data.avatarAnim || '';
      document.getElementById('edit-accent').value = data.accentColor || '#8b5cf6';
      document.getElementById('edit-bg-type').value = data.bgType || 'color';
      document.getElementById('edit-bg-value').value = data.bgValue || '';
      document.getElementById('edit-music-url').value = data.musicUrl || '';
      document.getElementById('edit-click-enter').checked = !!data.clickToEnter;
    }

    document.getElementById('btn-save-link').addEventListener('click', async () => {
      const id = document.getElementById('link-id-hidden').value || `link_${Date.now()}`;
      const title = document.getElementById('link-title').value;
      const url = document.getElementById('link-url').value;
      const description = document.getElementById('link-desc').value;
      const icon = document.getElementById('link-icon').value;

      const payload = {
        title, url, description, icon, enabled: true,
        order: linksData[id] ? linksData[id].order : Object.keys(linksData).length
      };

      await set(ref(db, `links/${currentUID}/${id}`), payload);
      document.getElementById('link-id-hidden').value = '';
      document.getElementById('link-title').value = '';
      document.getElementById('link-url').value = '';
      document.getElementById('link-desc').value = '';
      document.getElementById('link-icon').value = '';
    });

    function renderAdminLinks(linksObj) {
      const container = document.getElementById('admin-links-list');
      container.innerHTML = '';

      const linksArray = Object.keys(linksObj).map(k => ({ id: k, ...linksObj[k] }));
      linksArray.sort((a, b) => (a.order || 0) - (b.order || 0));

      linksArray.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card-list-item';
        card.draggable = true;

        card.innerHTML = `
          <div>
            <i class="fa-solid fa-grip-vertical" style="cursor:grab; margin-right:8px;"></i>
            <strong>${sanitizeHTML(item.title)}</strong>
            <p style="font-size:0.8rem; color:var(--text-muted);">${sanitizeHTML(item.url)}</p>
          </div>
          <div>
            <button onclick="editLink('${item.id}')" style="background:none; border:none; color:#3b82f6; cursor:pointer; margin-right:8px;"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteLink('${item.id}')" style="background:none; border:none; color:#ef4444; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
          </div>
        `;

        card.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', item.id));
        card.addEventListener('dragover', (e) => e.preventDefault());
        card.addEventListener('drop', async (e) => {
          e.preventDefault();
          const draggedId = e.dataTransfer.getData('text/plain');
          if (draggedId !== item.id) {
            const order1 = linksData[draggedId].order;
            const order2 = linksData[item.id].order;
            await update(ref(db, `links/${currentUID}/${draggedId}`), { order: order2 });
            await update(ref(db, `links/${currentUID}/${item.id}`), { order: order1 });
          }
        });

        container.appendChild(card);
      });
    }

    window.editLink = function(id) {
      const item = linksData[id];
      document.getElementById('link-id-hidden').value = id;
      document.getElementById('link-title').value = item.title || '';
      document.getElementById('link-url').value = item.url || '';
      document.getElementById('link-desc').value = item.description || '';
      document.getElementById('link-icon').value = item.icon || '';
    };

    window.deleteLink = async function(id) {
      if (confirm('Xóa link này?')) {
        await remove(ref(db, `links/${currentUID}/${id}`));
      }
    };

    const SOCIAL_PLATFORMS = ['facebook', 'tiktok', 'youtube', 'instagram', 'discord', 'telegram', 'github', 'x', 'email'];

    function renderAdminSocials(data) {
      const container = document.getElementById('socials-editor-list');
      container.innerHTML = '';

      SOCIAL_PLATFORMS.forEach(platform => {
        const item = data[platform] || { url: '', enabled: false };
        const div = document.createElement('div');
        div.className = 'form-group';
        div.style.flexDirection = 'row';
        div.style.alignItems = 'center';

        div.innerHTML = `
          <input type="checkbox" id="soc-enable-${platform}" ${item.enabled ? 'checked' : ''} style="width:20px; height:20px;">
          <label style="width:100px; text-transform:capitalize;">${platform}</label>
          <input type="text" id="soc-url-${platform}" value="${sanitizeHTML(item.url)}" placeholder="URL hoặc Username" style="flex:1;">
        `;
        container.appendChild(div);
      });
    }

    document.getElementById('btn-save-socials').addEventListener('click', async () => {
      const payload = {};
      SOCIAL_PLATFORMS.forEach(p => {
        payload[p] = {
          enabled: document.getElementById(`soc-enable-${p}`).checked,
          url: document.getElementById(`soc-url-${p}`).value.trim()
        };
      });
      await set(ref(db, `socials/${currentUID}`), payload);
      alert('Đã lưu Mạng xã hội!');
    });

    document.getElementById('btn-save-appearance').addEventListener('click', async () => {
      await update(ref(db, `profiles/${currentUID}`), {
        accentColor: document.getElementById('edit-accent').value,
        bgType: document.getElementById('edit-bg-type').value,
        bgValue: document.getElementById('edit-bg-value').value,
        musicUrl: document.getElementById('edit-music-url').value,
        clickToEnter: document.getElementById('edit-click-enter').checked
      });
      alert('Đã lưu Giao diện!');
    });

    // Tự động tải dữ liệu khi mở trang
    initAdminData();
  </script>
</body>
</html>
