<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Bio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0a0a0c;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .admin-card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h2 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #8b5cf6;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      color: #9ca3af;
      font-weight: 500;
    }

    input, textarea {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus {
      border-color: #8b5cf6;
    }

    button {
      background: #8b5cf6;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    button:hover {
      background: #7c3aed;
    }

    button:active {
      transform: scale(0.98);
    }

    #status-msg {
      text-align: center;
      font-size: 0.85rem;
      min-height: 20px;
    }

    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2><i class="fa-solid fa-sliders"></i> QUẢN TRỊ TRANG BIO</h2>

    <div class="form-group">
      <label>Tên hiển thị</label>
      <input type="text" id="edit-name" placeholder="Nhập tên của bạn...">
    </div>

    <div class="form-group">
      <label>Mô tả / Bio</label>
      <textarea id="edit-bio" rows="3" placeholder="Nhập phần giới thiệu ngắn..."></textarea>
    </div>

    <div class="form-group">
      <label>Link Ảnh Avatar (URL)</label>
      <input type="text" id="edit-avatar" placeholder="https://i.imgur.com/example.png">
    </div>

    <button id="btn-save">
      <i class="fa-solid fa-floppy-disk"></i> LƯU TRANG BIO
    </button>

    <div id="status-msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDM5EOHtjhxrWvGxL7hegMi5n0TbdV9cpw",
      authDomain: "taikhoan-fc704.firebaseapp.com",
      databaseURL: "https://taikhoan-fc704-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "taikhoan-fc704",
      storageBucket: "taikhoan-fc704.firebasestorage.app",
      messagingSenderId: "867203109533",
      appId: "1:867203109533:web:ec5b3b8efd2fee8df37a74",
      measurementId: "G-PQDSS2N5XE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const KEY = "my_bio";

    const nameInput = document.getElementById('edit-name');
    const bioInput = document.getElementById('edit-bio');
    const avatarInput = document.getElementById('edit-avatar');
    const btnSave = document.getElementById('btn-save');
    const statusMsg = document.getElementById('status-msg');

    // 1. Tự động nạp dữ liệu cũ khi mở trang
    async function loadCurrentBio() {
      statusMsg.className = '';
      statusMsg.innerText = "Đang tải dữ liệu...";
      try {
        const snap = await get(child(ref(db), `profiles/${KEY}`));
        if (snap.exists()) {
          const data = snap.val();
          nameInput.value = data.name || '';
          bioInput.value = data.bio || '';
          avatarInput.value = data.avatar || '';
          statusMsg.innerText = "";
        } else {
          statusMsg.innerText = "Chưa có dữ liệu, hãy nhập thông tin mới!";
        }
      } catch (err) {
        statusMsg.className = 'error';
        statusMsg.innerText = "Lỗi kết nối Firebase: " + err.message;
      }
    }

    // 2. Lưu thông tin mới khi nhấn nút
    btnSave.addEventListener('click', async () => {
      statusMsg.className = '';
      statusMsg.innerText = "Đang lưu...";

      const payload = {
        name: nameInput.value.trim(),
        bio: bioInput.value.trim(),
        avatar: avatarInput.value.trim()
      };

      try {
        await set(ref(db, `profiles/${KEY}`), payload);
        statusMsg.className = 'success';
        statusMsg.innerText = "✓ Lưu thông tin thành công!";
      } catch (err) {
        statusMsg.className = 'error';
        statusMsg.innerText = "✕ Lỗi khi lưu: " + err.message;
      }
    });

    loadCurrentBio();
  </script>
</body>
</html>
